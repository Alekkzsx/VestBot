<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETECPRO - Interpretação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row font-sans text-slate-800 bg-slate-50">
    <barra-lateral item-ativo="interpretacao"></barra-lateral>
    <main class="flex-1 h-[calc(100vh)] overflow-y-auto bg-[#f8fafc] relative flex flex-col">
      <barra-superior></barra-superior>
      <div class="max-w-[1600px] mx-auto px-6 md:px-12 md:pb-12 w-full flex-1">
        <div class="animate-fade-in font-sans text-slate-900 max-w-6xl mx-auto">
          <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <h2 class="text-3xl font-bold text-slate-900 mb-1">Módulo de Interpretação Textual</h2>
              <p class="text-slate-500 text-sm">Treine leitura dinâmica e análise profunda de textos cobrados na ETEC.</p>
            </div>
          </header>

          <div id="interpretacao-app" class="w-full">
            <!-- Renderizado dinamicamente pelo interpretacao.js -->
          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- Dependências -->
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <script src="../js/gerenciadorSincronizacao.js"></script>
  
  <!-- Componentes Web em Português -->
  <script src="../componentes/BarraLateral.js"></script>
  <script src="../componentes/BarraSuperior.js"></script>
  
  <!-- Script Principal da Tela -->
  <script src="js/interpretacao.js"></script>
</body>
</html>
