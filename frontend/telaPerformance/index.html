<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETECPRO - Desempenho Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row font-sans text-slate-800 bg-slate-50">
    
    <app-sidebar active-item="performance"></app-sidebar>

    <main class="flex-1 h-[calc(100vh)] overflow-y-auto bg-[#f8fafc] relative flex flex-col">
      <app-topbar></app-topbar>

      <div class="max-w-[1600px] mx-auto px-6 md:px-12 md:pb-12 w-full flex-1">
        <div class="animate-fade-in font-sans pb-10">
          <header class="mb-4">
            <h2 class="text-3xl font-bold text-slate-900 mb-1">Desempenho Estratégico</h2>
            <p class="text-slate-500 text-sm">Raio-x completo das suas habilidades focadas no Vestibulinho.</p>
          </header>

          <!-- Tabs Navigation -->
          <div class="flex gap-2 mb-8 bg-slate-200/50 p-1 rounded-xl w-fit flex-wrap">
            <button id="btn-tab-overview" class="tab-btn px-6 py-2 rounded-lg text-sm font-bold transition-all bg-black text-white shadow-sm flex items-center gap-2">
              <i class="fas fa-chart-pie"></i> Visão Geral
            </button>
            <button id="btn-tab-behavior" class="tab-btn px-6 py-2 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-900 flex items-center gap-2 relative">
              <i class="fas fa-brain"></i> Comportamento <span class="bg-blue-500 text-white text-[9px] px-1.5 py-0.5 rounded-full absolute -top-2 -right-2 animate-pulse">NOVO</span>
            </button>
            <button id="btn-tab-question" class="tab-btn px-6 py-2 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-900 flex items-center gap-2">
              <i class="fas fa-search-location"></i> Raio-X por Questão
            </button>
          </div>

          <!-- TAB COMPONENTS -->
          <perf-overview-tab></perf-overview-tab>
          <perf-behavior-tab></perf-behavior-tab>
          <perf-question-tab></perf-question-tab>

        </div>
      </div>
    </main>
  </div>
  
  <script src="../components/Sidebar.js"></script>
  <script src="../components/Topbar.js"></script>
  <script src="../components/performance/OverviewTab.js"></script>
  <script src="../components/performance/BehaviorTab.js"></script>
  <script src="../components/performance/QuestionTab.js"></script>
  <script src="../js/syncManager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
