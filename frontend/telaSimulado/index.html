<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETECPRO - Simulados ETEC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row font-sans text-slate-800 bg-slate-50">
    
    <!-- Sidebar Component -->
    <app-sidebar active-item="quiz"></app-sidebar>

    <main class="flex-1 h-[calc(100vh)] overflow-y-auto bg-[#f8fafc] relative flex flex-col">
      <!-- Topbar Component -->
      <app-topbar></app-topbar>

      <div class="max-w-[1600px] mx-auto px-6 md:px-12 md:pb-12 w-full flex-1">
        <div class="animate-fade-in font-sans pb-10">
          
          <!-- Componente 1: Hub de Seleção e Histórico de Simulados -->
          <simulado-hub></simulado-hub>

          <!-- Componente 2: Engine do Player da Prova Oficial (4h, 50Q, Cartão-Resposta) -->
          <simulado-player></simulado-player>

          <!-- Componente 3: Relatório e Diagnóstico Pós-Entrega -->
          <simulado-result></simulado-result>

        </div>
      </div>
    </main>
  </div>

  <!-- Web Components -->
  <script src="../components/Sidebar.js"></script>
  <script src="../components/Topbar.js"></script>
  <script src="../components/simulado/SimuladoHub.js"></script>
  <script src="../components/simulado/SimuladoPlayer.js"></script>
  <script src="../components/simulado/SimuladoResult.js"></script>
  <!-- Offline-First Sync & Exam Engine -->
  <script src="../js/syncManager.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
