<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETECPRO - Cronograma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row font-sans text-slate-800 bg-slate-50">
    <barra-lateral item-ativo="cronograma"></barra-lateral>
    <main class="flex-1 h-[calc(100vh)] overflow-y-auto bg-[#f8fafc] relative flex flex-col">
      <barra-superior></barra-superior>
      <div class="max-w-[1600px] mx-auto px-6 md:px-12 md:pb-12 w-full flex-1 flex flex-col">
        <div class="animate-fade-in font-sans text-slate-900 w-full mx-auto flex-1 flex flex-col">
          <header class="mb-8 flex flex-col md:flex-row md:items-end justify-between gap-4 mt-8">
            <div>
              <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 bg-black text-white rounded-xl flex items-center justify-center text-lg shadow-md">
                  <i class="fas fa-calendar-alt"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight">Cronograma de Estudos</h2>
              </div>
              <p class="text-slate-500 text-sm">Trilha semanal inteligente focada nos assuntos mais cobrados da ETEC.</p>
            </div>
            
            <div class="flex items-center gap-4">
              <div class="hidden md:flex flex-col items-end mr-4">
                <span id="progresso-semanal-texto" class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">0% Concluído</span>
                <div class="w-32 h-1.5 bg-slate-200 rounded-full overflow-hidden">
                  <div id="progresso-semanal-barra" class="h-full bg-black w-0 transition-all duration-500"></div>
                </div>
              </div>
              <button id="btn-abrir-modal" class="bg-white text-slate-700 border border-slate-200 px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-slate-50 transition-colors shadow-sm flex items-center mr-2">
                <i class="fas fa-plus mr-2 text-slate-400"></i> Adicionar
              </button>
              <button id="btn-gerar-ia" class="bg-black text-white px-5 py-2.5 rounded-xl text-sm font-bold hover:bg-slate-800 transition-colors shadow-md flex items-center">
                <i class="fas fa-bolt text-yellow-400 mr-2"></i> Gerar Novo
              </button>
            </div>
          </header>
          
          <!-- Container Semanal Kanban -->
          <div class="flex-1 overflow-x-auto pb-6 custom-scrollbar">
            <div id="container-semanas" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-7 gap-4 min-w-[1200px] h-full">
              <!-- Os dias serão injetados via JS -->
            </div>
          </div>
        </div>
      </div>

      <!-- Modal Adicionar Atividade -->
      <div id="modal-atividade" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center opacity-0 transition-opacity">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 transform scale-95 transition-transform duration-300">
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-xl font-black text-slate-900">Nova Atividade</h3>
            <button id="btn-fechar-modal" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center transition-colors"><i class="fas fa-times"></i></button>
          </div>
          <form id="form-atividade" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Dia da Semana</label>
              <select id="input-dia" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:border-black focus:ring-0 outline-none" required>
                <option value="Segunda-feira">Segunda-feira</option>
                <option value="Terça-feira">Terça-feira</option>
                <option value="Quarta-feira">Quarta-feira</option>
                <option value="Quinta-feira">Quinta-feira</option>
                <option value="Sexta-feira">Sexta-feira</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Matéria / Categoria</label>
              <input type="text" id="input-materia" placeholder="Ex: Matemática, Revisão..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:border-black focus:ring-0 outline-none" required>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Tópico</label>
              <input type="text" id="input-topico" placeholder="Ex: Regra de Três" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:border-black focus:ring-0 outline-none" required>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1">Duração Estimada</label>
              <input type="text" id="input-duracao" placeholder="Ex: 1h, 45min" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:border-black focus:ring-0 outline-none" required>
            </div>
            <button type="submit" class="w-full bg-black text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition-colors mt-4">Salvar Atividade</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <!-- Componentes Web em Português -->
  <script src="../componentes/BarraLateral.js"></script>
  <script src="../componentes/BarraSuperior.js"></script>
  
  <!-- Dexie para banco de dados local -->
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <!-- Lógica de Sincronização Local (Necessário para carregar o banco) -->
  <script src="../js/gerenciadorSincronizacao.js"></script>
  <!-- Lógica da Tela -->
  <script src="js/cronograma.js"></script>
</body>
</html>
