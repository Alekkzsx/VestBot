<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETECPRO - Engenharia (Painel Admin)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row font-sans text-slate-800 bg-slate-50">
    <barra-lateral item-ativo="engenharia"></barra-lateral>
    
    <main class="flex-1 h-[calc(100vh)] overflow-y-auto bg-[#f8fafc] relative flex flex-col custom-scrollbar">
      <barra-superior></barra-superior>
      
      <div class="max-w-5xl mx-auto px-6 md:px-12 md:pb-12 w-full flex-1">
        <div class="animate-fade-in font-sans pb-10">
          
          <header class="mb-8 mt-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <div class="inline-flex items-center gap-2 px-3 py-1 bg-red-100 text-red-700 font-bold text-[10px] rounded-full uppercase tracking-widest mb-3">
                <i class="fas fa-lock"></i> Acesso Restrito
              </div>
              <h2 class="text-3xl font-black text-slate-900 mb-1">Engenharia de Dados</h2>
              <p class="text-slate-500 text-sm">Painel administrativo para popular o banco de dados com questões reais.</p>
            </div>
          </header>

          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8 md:p-10">
            <form id="form-engenharia">
              
              <!-- TIPO DE QUESTÃO -->
              <div class="mb-10 p-6 bg-slate-50 rounded-2xl border border-slate-200">
                <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fas fa-layer-group text-slate-400"></i> Estrutura da Questão</h3>
                
                <label class="flex items-center gap-3 cursor-pointer group w-max">
                  <div class="relative w-12 h-6 bg-slate-300 rounded-full group-hover:bg-slate-400 transition-colors">
                    <input type="checkbox" id="check-interpretacao" class="sr-only peer">
                    <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-all peer-checked:translate-x-6 peer-checked:bg-blue-600"></div>
                  </div>
                  <span class="text-sm font-bold text-slate-700 select-none">Esta é uma Questão de Interpretação (Requer Texto Base)</span>
                </label>
              </div>

              <!-- METADADOS -->
              <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fas fa-tags text-slate-400"></i> Metadados</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Disciplina</label>
                  <select id="input-disciplina" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm font-medium" required>
                    <option value="">Selecione...</option>
                    <option value="Língua Portuguesa">Língua Portuguesa</option>
                    <option value="Matemática">Matemática</option>
                    <option value="História">História</option>
                    <option value="Geografia">Geografia</option>
                    <option value="Biologia">Biologia</option>
                    <option value="Física">Física</option>
                    <option value="Química">Química</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Assunto / Tema</label>
                  <input type="text" id="input-assunto" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm font-medium" placeholder="Ex: Regra de Três" required>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Fonte da Prova</label>
                  <input type="text" id="input-fonte" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm font-medium" placeholder="Ex: ETEC" required>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Ano</label>
                  <input type="number" id="input-ano" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm font-medium" placeholder="Ex: 2023" required>
                </div>
              </div>

              <!-- ÁREA DE TEXTO BASE (ESCONDIDO POR PADRÃO) -->
              <div id="container-texto-base" class="hidden mb-10 p-6 bg-amber-50 rounded-2xl border border-amber-200">
                <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fas fa-align-left text-amber-500"></i> Texto Base (Para Interpretação)</h3>
                <div class="mb-4">
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Título do Texto (Opcional)</label>
                  <input type="text" id="input-texto-titulo" class="w-full p-3 bg-white border border-amber-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm font-medium" placeholder="Ex: A Inteligência Artificial na Educação">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Conteúdo Completo (Aceita HTML)</label>
                  <textarea id="input-texto-conteudo" rows="6" class="w-full p-4 bg-white border border-amber-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm leading-loose font-mono custom-scrollbar" placeholder="<p>Cole o textão aqui...</p>"></textarea>
                </div>
              </div>

              <!-- ENUNCIADO -->
              <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fas fa-question-circle text-slate-400"></i> A Questão</h3>
              <div class="mb-8">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Enunciado</label>
                <textarea id="input-enunciado" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm leading-relaxed font-medium custom-scrollbar" placeholder="Digite a pergunta..." required></textarea>
              </div>

              <!-- ALTERNATIVAS -->
              <div class="mb-8 bg-slate-50 p-6 rounded-2xl border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                  <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Alternativas</label>
                  <span class="text-xs text-slate-400">Marque o rádio da correta</span>
                </div>
                <div class="space-y-3" id="container-alternativas">
                  <!-- Gerado via JS -->
                </div>
              </div>

              <!-- RESOLUÇÃO COMENTADA -->
              <div class="mb-10">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Resolução Comentada (Opcional)</label>
                <textarea id="input-resolucao" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:border-black focus:ring-1 focus:ring-black outline-none transition-all text-sm leading-relaxed custom-scrollbar" placeholder="Explique por que a alternativa X está correta..."></textarea>
              </div>

              <!-- SUBMIT -->
              <div class="flex gap-4 border-t border-slate-100 pt-8 mt-8">
                <button type="button" id="btn-limpar" class="px-8 py-4 bg-white text-slate-600 border border-slate-200 rounded-xl font-bold hover:bg-slate-50 transition-colors">Limpar Form</button>
                <button type="submit" id="btn-salvar" class="flex-1 bg-black text-white rounded-xl font-bold py-4 hover:bg-slate-800 transition-colors shadow-md flex items-center justify-center gap-2">
                  <i class="fas fa-save"></i> Salvar Questão no Banco
                </button>
              </div>

            </form>
          </div>
          
        </div>
      </div>
    </main>
  </div>

  <script src="../componentes/BarraLateral.js"></script>
  <script src="../componentes/BarraSuperior.js"></script>
  <script src="js/engenharia.js"></script>
</body>
</html>
