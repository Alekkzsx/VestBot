<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETECPRO - Analytics Preditivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col md:flex-row font-sans text-slate-800 bg-slate-50">
    
    <!-- Sidebar Component -->
    <app-sidebar active-item="analytics"></app-sidebar>

    <main class="flex-1 h-[calc(100vh)] overflow-y-auto bg-[#f8fafc] relative flex flex-col">
      <!-- Topbar Component -->
      <app-topbar></app-topbar>

      <div class="max-w-[1600px] mx-auto px-6 md:px-12 md:pb-12 w-full flex-1">
        <div class="animate-fade-in font-sans pb-10">
          
          <!-- Header -->
          <header class="mb-8">
            <h2 class="text-3xl font-bold text-slate-900 mb-1">Analytics Preditivo & Inteligência Competitiva</h2>
            <p class="text-slate-500 text-sm">Simulação de aprovação baseada nas notas de corte oficiais, bônus de pontuação acrescida e projeção temporal.</p>
          </header>

          <!-- Componente 1: Predição de Aprovação & Nota de Corte Dinâmica -->
          <analytics-prediction></analytics-prediction>

          <!-- Componente 2: Matriz de Prioridade de Estudos -->
          <analytics-priority></analytics-priority>

          <!-- Componente 3: Projeção de Nota até a Prova & Radar Competitivo -->
          <analytics-projection></analytics-projection>

        </div>
      </div>
    </main>
  </div>

  <!-- Web Components -->
  <script src="../components/Sidebar.js"></script>
  <script src="../components/Topbar.js"></script>
  <script src="../components/analytics/AnalyticsPrediction.js"></script>
  <script src="../components/analytics/AnalyticsPriority.js"></script>
  <script src="../components/analytics/AnalyticsProjection.js"></script>
  <!-- Interactive Logic & Chart.js -->
  <script src="js/main.js"></script>
</body>
</html>
